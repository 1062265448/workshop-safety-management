services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wsms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wsms
      POSTGRES_PASSWORD: wsms_dev_2026
      POSTGRES_DB: workshop_safety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsms -d workshop_safety"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
